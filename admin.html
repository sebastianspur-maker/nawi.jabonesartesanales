<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Nawi · Administración</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Italiana&display=swap" rel="stylesheet">
<style>
:root{--paper:#fbf8f2;--ivory:#f3eee4;--ink:#373a33;--muted:#72756c;--sage:#68745e;--line:rgba(55,58,51,.14);--serif:'Italiana',Georgia,serif;--sans:'DM Sans',Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}header{padding:26px 5vw;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font-family:var(--serif);font-size:30px;letter-spacing:.14em}.sub{font-size:10px;letter-spacing:.18em;color:var(--muted)}main{max-width:1180px;margin:auto;padding:50px 5vw 80px}.login{max-width:440px;margin:70px auto;background:var(--ivory);padding:36px}.login h1,.page-title{font-family:var(--serif);font-weight:400}.login h1{font-size:42px;margin:0 0 14px}.login p{font-size:12px;color:var(--muted);line-height:1.6}.login input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:13px 0;margin:14px 0 22px;outline:none}.btn{border:0;background:var(--sage);color:white;padding:13px 18px;cursor:pointer}.error{color:#8a4b3b;font-size:11px;margin-top:12px}.hidden{display:none!important}.toolbar{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:28px}.page-title{font-size:46px;margin:0}.meta{font-size:11px;color:var(--muted)}.orders{display:grid;gap:14px}.order{border:1px solid var(--line);background:#fff}.order-head{padding:18px 20px;display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:18px;align-items:center;cursor:pointer}.order-id{font-weight:600;font-size:13px}.order-date,.order-customer{font-size:11px;color:var(--muted)}.order-total{font-family:var(--serif);font-size:24px}.details{border-top:1px solid var(--line);padding:20px;display:none}.order.open .details{display:block}.contact{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.contact div{font-size:11px}.contact b{display:block;font-size:9px;letter-spacing:.12em;color:var(--muted);margin-bottom:4px}.items{border-top:1px solid var(--line)}.item{display:grid;grid-template-columns:1fr auto auto;gap:20px;padding:10px 0;border-bottom:1px solid rgba(55,58,51,.07);font-size:11px}.status{display:inline-block;background:#e4e6dc;padding:6px 9px;font-size:9px;letter-spacing:.1em}.empty{text-align:center;color:var(--muted);padding:80px 20px}.logout{border:0;background:none;text-decoration:underline;color:var(--muted);font-size:10px;cursor:pointer}@media(max-width:760px){.order-head{grid-template-columns:1fr auto}.order-date,.order-customer{grid-column:1/-1}.contact{grid-template-columns:1fr}.page-title{font-size:38px}.toolbar{align-items:start}}
</style>
</head>
<body>
<header><div><div class="brand">NAWI</div><div class="sub">ADMINISTRACIÓN</div></div><button id="logout" class="logout hidden">Cerrar sesión</button></header>
<main>
<section id="login" class="login">
<h1>Administración</h1>
<p>Ingresá la clave privada para consultar los pedidos realizados desde la web.</p>
<input id="password" type="password" autocomplete="current-password" placeholder="Clave de administración"/>
<button id="loginBtn" class="btn">Ingresar</button>
<div id="loginError" class="error hidden"></div>
</section>
<section id="dashboard" class="hidden">
<div class="toolbar"><div><div class="sub">PEDIDOS</div><h1 class="page-title">Pedidos recibidos</h1><div id="meta" class="meta"></div></div><button id="refresh" class="btn">Actualizar</button></div>
<div id="orders" class="orders"></div>
</section>
</main>
<script src="/admin.js"></script>
</body>
</html>
